<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22271f">
<link rel="icon" href="data:,">
<title>Banyo</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<section id="ust">
  <canvas id="view" tabindex="0" aria-label="Üç boyutlu banyo, sürükleyerek etrafa bakın"></canvas>
  <div id="secim" role="group" aria-label="Banyo seç">
    <select id="scene" aria-label="Banyo seçimi"></select>
  </div>
  <div id="araclar">
    <button id="home" aria-label="Başlangıç konumuna dön">⟲</button>
    <button id="overview" aria-label="Üstten bak">▣</button>
  </div>
  <div id="status" role="status">Yükleniyor…</div>
  <div id="joystick" role="group" aria-label="İleri, geri ve yana hareket"><div id="stick"></div></div>
  <div id="vertical"><button id="up" aria-label="Yukarı">↑</button><button id="down" aria-label="Aşağı">↓</button></div>
</section>
<section id="alt">
  <div id="galeri" aria-label="Fotoğraflar"></div>
  <div id="noktalar" aria-hidden="true"></div>
</section>
<script type="module" src="site.js"></script>
</body>
</html>
