<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900"><rect width="1400" height="1900" fill="#faf8f2"/>
<text x="65" y="70" font-family="Arial,sans-serif" font-size="34" fill="#27362f">Alternatif_6 · GÖMME DUŞ / KOT DETAYI</text>
<text x="65" y="115" font-family="Arial,sans-serif" font-size="22" fill="#27362f">ÜRÜN MODELİ BİLİNMİYOR · TEMSİLİ GÖVDE · KESİM ŞABLONU DEĞİLDİR</text>
<text x="65" y="155" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Ön görünüş · bitmiş döşemeden cm</text>
<rect x="100" y="286" width="480" height="924" fill="#e6e4db" stroke="#7a8579"/>
<path d="M340 770V374M340 770h52v36" fill="none" stroke="#ae55d1" stroke-width="6" stroke-dasharray="9 5"/>
<rect x="308" y="730" width="64" height="80" fill="#aab9b9" stroke="#425552"/>
<path d="M600 1210H660" stroke="#7a8579"/>
<text x="685" y="1216" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Bitmiş döşeme 0</text>
<path d="M600 806H660" stroke="#7a8579"/>
<text x="685" y="812" font-family="Arial,sans-serif" font-size="22" fill="#27362f">El duşu çıkışı 101</text>
<path d="M600 770H660" stroke="#7a8579"/>
<text x="685" y="776" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Kumanda merkezi 110</text>
<path d="M600 374H660" stroke="#7a8579"/>
<text x="685" y="380" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Tepe çıkışı 209</text>
<path d="M600 286H660" stroke="#7a8579"/>
<text x="685" y="292" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Tavan 231</text>
<text x="100" y="1280" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Batarya ekseni X=182.5 cm; arka bitmiş duvar Y=275 cm.</text>
<text x="100" y="1325" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Gövde: temsili 14 × 9 × 17 cm; merkezi Y=280 cm.</text>
<text x="100" y="1370" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Port yönleri, gömme derinliği ve kapak ölçüsü satın alınan üründen alınmalı.</text>
<text x="100" y="1415" font-family="Arial,sans-serif" font-size="22" fill="#27362f">Duvar kalınlığı / taşıyıcı türü bilinmiyor; burada kanal veya delik ölçüsü verilmez.</text>
<text x="100" y="1490" font-family="Arial,sans-serif" font-size="26" fill="#27362f">TEKNİK KONTROL İÇİN</text>
<text x="100" y="1540" font-family="Arial,sans-serif" font-size="20" fill="#27362f">Sıcak ve soğuk girişler, tepe ve el duşu çıkışları ürün şemasına göre eşleştirilmeli.</text>
<text x="100" y="1588" font-family="Arial,sans-serif" font-size="20" fill="#27362f">Gövde servis erişimi ve su yalıtım manşeti kapatmadan önce kontrol edilmeli.</text>
<text x="100" y="1636" font-family="Arial,sans-serif" font-size="20" fill="#27362f">Gövde basınç/sızdırmazlık testi ürünün montaj talimatına göre yapılmalı.</text>
<text x="100" y="1684" font-family="Arial,sans-serif" font-size="20" fill="#27362f">Elektrik ve gider paftaları ayrı sayfalardadır; mevcut bağlantı noktaları henüz ölçülmedi.</text>
<text x="100" y="1800" font-family="Arial,sans-serif" font-size="23" fill="#27362f">Usta incelemesi için koordinasyon taslağı · uygulama projesi değildir</text>
</svg>