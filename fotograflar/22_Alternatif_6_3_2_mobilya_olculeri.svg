<text x="95" y="910" font-size="18">35 × 50</text>
<text x="250" y="910" font-size="18">90 × 50</text>
<text x="650" y="910" font-size="18">35 × 14</text>
<text x="55" y="970" font-size="18">Lavabo dolabı: 90 genişlik × 50 derinlik × 55 yükseklik; alt kot 15, üst kot 70.</text>
<text x="55" y="1006" font-size="18">İki çekmece: gövde yüksekliğinde iki eşit 27,5 cm bölüm; kapak araları ayrıca paylı.</text>
<text x="55" y="1042" font-size="18">Taş lavabo: 90 × 50 × 15; alt kot 70, üst kot 85. Dikdörtgen oyuk hazne.</text>
<text x="55" y="1078" font-size="18">Lavabo yanındaki boy dolabı: 35 × 50; alt kot 15, üst kot 200 (yükseklik kabulü).</text>
<text x="55" y="1114" font-size="18">WC üstü: iki kapak; toplam 92 × 14 × 50; alt kot 158, üst kot 208.</text>
<text x="55" y="1150" font-size="18">WC yanı: 35 × 14 × 193; beş açık göz, kapaksız; alt kot 15, üst kot 208.</text>
<text x="55" y="1186" font-size="18">18 mm levha kabulüyle beş açık gözün net yüksekliği yaklaşık 36,44 cm.</text>
<text x="55" y="1222" font-size="18">Ayna: önceki sahne gibi yuvarlak Ø80; merkez kotu 152 cm.</text>
<text x="55" y="1258" font-size="18">Dolapların tümü web menüsünden aynı altı ahşap seçeneğiyle değiştirilebilir.</text>
<text x="55" y="1294" font-size="18">Taş hazne iç ölçüsü ve batarya delikleri ürün şablonundan kesinleştirilmelidir.</text>
<text x="55" y="1330" font-size="18">Üç çubuk kulp: her biri 50 cm · duşla aynı krom.</text>
<text x="55" y="1366" font-size="18">Çekmeceler: yatayda ortalı; gerçek çekmece üst kenarından kulp eksenine 4 cm.</text>
<text x="55" y="1402" font-size="18">Boy dolabı: lavaboya bakan sağ kapak kenarından eksene 4 cm; dikey.</text>
<text x="55" y="1438" font-size="18">Boy kulpu merkezi 142,5 cm kabulü; kulp çapı 1,2 ve arka açıklığı 2,8 cm kabulüdür.</text>
