<text x="110" y="1934" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#40533a">Boy dolabının alt ve üst kapağı odaya açılır; ayna lavaboya ortalanır.</text>
<text x="80" y="2170" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#30352e">WC üst dolapları: 2 adet 45 × 20 × 50 cm; alt kot 158 cm, üst kot 208 cm (duş kabini üstüyle aynı).</text>
<text x="80" y="2210" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#30352e">Düz rezervuar duvarı 90 × 20 × 120 cm; dolaplara kadar 38 cm boşluk.</text>
<text x="80" y="2250" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#30352e">Karşı duvar: solda boy dolabı, ortada lavabo, sağda duş. Boy dolabı alt kotu 30 cm.</text>
