<text x="110" y="198" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#754a2f">Lavabo ve batarya delikleri bu listede yoktur; satın alınan ürünün kendi şablonuna göre açılmalıdır.</text>
<text x="110" y="228" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#754a2f">Gerçek levha kalınlığı 2 cm değilse usta iç parça ölçülerini levha kalınlığına göre düzeltmelidir.</text>
<text x="80" y="305" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#30352e">MOBİLYA PARÇA ŞEMASI</text>
